<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Finalize seu pedido com segurança."
    >

    <title>
        Finalizar pedido
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >
            MINHA LOJA
        </a>


        <a
            href="index.html"
            class="back-link"
        >
            ← Continuar comprando
        </a>

    </div>

</header>



<main class="checkout-page">

    <div class="container">


        <!-- CABEÇALHO -->

        <div class="checkout-header">

            <span>
                FINALIZAÇÃO
            </span>

            <h1>
                Finalize seu pedido
            </h1>

            <p>
                Preencha seus dados para continuar.
            </p>

        </div>



        <div class="checkout-layout">


            <!-- FORMULÁRIO -->

            <section class="checkout-form">

                <form id="checkoutForm">


                    <!-- DADOS DO CLIENTE -->

                    <div class="checkout-section">

                        <h2>
                            Seus dados
                        </h2>


                        <div class="form-group">

                            <label for="name">
                                Nome completo
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Seu nome completo"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="email">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="seu@email.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="phone">
                                    WhatsApp
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="(51) 99999-9999"
                                    autocomplete="tel"
                                    required
                                >

                            </div>

                        </div>

                    </div>



                    <!-- ENDEREÇO -->

                    <div class="checkout-section">

                        <h2>
                            Endereço de entrega
                        </h2>


                        <!-- CEP + ESTADO -->

                        <div class="form-row">

                            <div class="form-group">

                                <label for="cep">
                                    CEP
                                </label>


                                <div class="cep-wrapper">

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        placeholder="00000-000"
                                        inputmode="numeric"
                                        autocomplete="postal-code"
                                        maxlength="9"
                                        required
                                    >


                                    <span
                                        id="cepStatus"
                                        class="cep-status"
                                    ></span>

                                </div>

                            </div>


                            <div class="form-group">

                                <label for="state">
                                    Estado
                                </label>


                                <select
                                    id="state"
                                    name="state"
                                    autocomplete="address-level1"
                                    required
                                >

                                    <option value="">
                                        Selecione
                                    </option>

                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
