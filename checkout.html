<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Finalize seu pedido com segurança."
    >

    <title>
        Finalizar pedido
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >
            MINHA LOJA
        </a>


        <a
            href="index.html"
            class="back-link"
        >
            ← Continuar comprando
        </a>

    </div>

</header>



<main class="checkout-page">

    <div class="container">


        <!-- CABEÇALHO -->

        <div class="checkout-header">

            <span>
                FINALIZAÇÃO
            </span>

            <h1>
                Finalize seu pedido
            </h1>

            <p>
                Preencha seus dados para continuar.
            </p>

        </div>



        <div class="checkout-layout">


            <!-- =========================
                 FORMULÁRIO
            ========================== -->

            <section class="checkout-form">


                <form id="checkoutForm">


                    <!-- DADOS -->

                    <div class="checkout-section">

                        <h2>
                            Seus dados
                        </h2>


                        <div class="form-group">

                            <label for="name">
                                Nome completo
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Seu nome completo"
                                autocomplete="name"
                                required
                            >

                        </div>



                        <div class="form-row">


                            <div class="form-group">

                                <label for="email">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="seu@email.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>



                            <div class="form-group">

                                <label for="phone">
                                    WhatsApp
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="(51) 99999-9999"
                                    autocomplete="tel"
                                    required
                                >

                            </div>


                        </div>

                    </div>



                    <!-- =========================
                         ENDEREÇO
                    ========================== -->

                    <div class="checkout-section">


                        <h2>
                            Endereço de entrega
                        </h2>



                        <!-- CEP + ESTADO -->

                        <div class="form-row">


                            <div class="form-group">

                                <label for="cep">
                                    CEP
                                </label>


                                <div class="cep-wrapper">

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        placeholder="00000-000"
                                        inputmode="numeric"
                                        autocomplete="postal-code"
                                        maxlength="9"
                                        required
                                    >


                                    <span
                                        id="cepStatus"
                                        class="cep-status"
                                    ></span>

                                </div>

                            </div>



                            <div class="form-group">

                                <label for="state">
                                    Estado
                                </label>


                                <select
                                    id="state"
                                    name="state"
                                    autocomplete="address-level1"
                                    required
                                >

                                    <option value="">
                                        Selecione
                                    </option>

                                    <option value="AC">
                                        Acre
                                    </option>

                                    <option value="AL">
                                        Alagoas
                                    </option>

                                    <option value="AP">
                                        Amapá
                                    </option>

                                    <option value="AM">
                                        Amazonas
                                    </option>

                                    <option value="BA">
                                        Bahia
                                    </option>

                                    <option value="CE">
                                        Ceará
                                    </option>

                                    <option value="DF">
                                        Distrito Federal
                                    </option>

                                    <option value="ES">
                                        Espírito Santo
                                    </option>

                                    <option value="GO">
                                        Goiás
                                    </option>

                                    <option value="MA">
                                        Maranhão
                                    </option>

                                    <option value="MT">
                                        Mato Grosso
                                    </option>

                                    <option value="MS">
                                        Mato Grosso do Sul
                                    </option>

                                    <option value="MG">
                                        Minas Gerais
                                    </option>

                                    <option value="PA">
                                        Pará
                                    </option>

                                    <option value="PB">
                                        Paraíba
                                    </option>

                                    <option value="PR">
                                        Paraná
                                    </option>

                                    <option value="PE">
                                        Pernambuco
                                    </option>

                                    <option value="PI">
                                        Piauí
                                    </option>

                                    <option value="RJ">
                                        Rio de Janeiro
                                    </option>

                                    <option value="RN">
                                        Rio Grande do Norte
                                    </option>

                                    <option value="RS">
                                        Rio Grande do Sul
                                    </option>

                                    <option value="RO">
                                        Rondônia
                                    </option>

                                    <option value="RR">
                                        Roraima
                                    </option>

                                    <option value="SC">
                                        Santa Catarina
                                    </option>

                                    <option value="SP">
                                        São Paulo
                                    </option>

                                    <option value="SE">
                                        Sergipe
                                    </option>

                                    <option value="TO">
                                        Tocantins
                                    </option>

                                </select>

                            </div>


                        </div>



                        <!-- RUA -->

                        <div class="form-group">

                            <label for="street">
                                Rua
                            </label>

                            <input
                                type="text"
                                id="street"
                                name="street"
                                placeholder="Nome da rua"
                                autocomplete="street-address"
                                required
                            >

                        </div>



                        <!-- BAIRRO -->

                        <div class="form-group">

                            <label for="neighborhood">
                                Bairro
                            </label>

                            <input
                                type="text"
                                id="neighborhood"
                                name="neighborhood"
                                placeholder="Seu bairro"
                                autocomplete="address-line2"
                                required
                            >

                        </div>



                        <!-- NÚMERO + COMPLEMENTO -->

                        <div class="form-row">


                            <div class="form-group">

                                <label for="number">
                                    Número
                                </label>

                                <input
                                    type="text"
                                    id="number"
                                    name="number"
                                    placeholder="123"
                                    autocomplete="address-line2"
                                    required
                                >

                            </div>



                            <div class="form-group">

                                <label for="complement">
                                    Complemento
                                </label>

                                <input
                                    type="text"
                                    id="complement"
                                    name="complement"
                                    placeholder="Apto, casa..."
                                    autocomplete="address-line2"
                                >

                            </div>


                        </div>



                        <!-- CIDADE -->

                        <div class="form-group">

                            <label for="city">
                                Cidade
                            </label>

                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="Sua cidade"
                                autocomplete="address-level2"
                                required
                            >

                        </div>


                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="button checkout-submit"
                    >

                        Finalizar pedido

                    </button>


                </form>


            </section>



            <!-- =========================
                 RESUMO DO PEDIDO
            ========================== -->

            <aside class="checkout-summary">


                <h2>
                    Seu pedido
                </h2>



                <!-- PRODUTOS -->

                <div
                    id="checkoutItems"
                ></div>



                <!-- FRETE -->

                <div class="checkout-shipping">


                    <h3>
                        Entrega
                    </h3>



                    <label class="shipping-option">


                        <input
                            type="radio"
                            name="shipping"
                            value="0"
                            data-name="Retirada"
                        >


                        <div>

                            <strong>
                                Retirada
                            </strong>

                            <span>
                                Grátis
                            </span>

                        </div>


                    </label>



                    <label class="shipping-option">


                        <input
                            type="radio"
                            name="shipping"
                            value="15"
                            data-name="Entrega econômica"
                            checked
                        >


                        <div>

                            <strong>
                                Entrega econômica
                            </strong>

                            <span>
                                R$ 15,00
                            </span>

                        </div>


                    </label>



                    <label class="shipping-option">


                        <input
                            type="radio"
                            name="shipping"
                            value="29.90"
                            data-name="Entrega expressa"
                        >


                        <div>

                            <strong>
                                Entrega expressa
                            </strong>

                            <span>
                                R$ 29,90
                            </span>

                        </div>


                    </label>


                </div>



                <!-- SUBTOTAL -->

                <div class="checkout-price-row">


                    <span>
                        Subtotal
                    </span>


                    <strong
                        id="checkoutSubtotal"
                    >
                        R$ 0,00
                    </strong>


                </div>



                <!-- FRETE -->

                <div class="checkout-price-row">


                    <span>
                        Frete
                    </span>


                    <strong
                        id="checkoutShipping"
                    >
                        R$ 15,00
                    </strong>


                </div>



                <!-- TOTAL -->

                <div class="checkout-total">


                    <span>
                        Total
                    </span>


                    <strong
                        id="checkoutTotal"
                    >
                        R$ 0,00
                    </strong>


                </div>


            </aside>


        </div>

    </div>

</main>



<script src="script.js"></script>

<script src="checkout.js"></script>


</body>

    </html>
