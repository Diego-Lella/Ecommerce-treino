<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Finalize seu pedido com segurança."
    >

    <title>Finalizar Pedido</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >
            MINHA LOJA
        </a>

        <a
            href="index.html"
            class="back-link"
        >
            ← Continuar comprando
        </a>

    </div>

</header>



<main class="checkout-page">

    <div class="container">


        <div class="checkout-header">

            <span>
                FINALIZAÇÃO
            </span>

            <h1>
                Finalize seu pedido
            </h1>

            <p>
                Preencha seus dados para continuar.
            </p>

        </div>



        <div class="checkout-layout">


            <!-- =========================
                 FORMULÁRIO
            ========================== -->

            <section class="checkout-form">

                <form id="checkoutForm">


                    <div class="checkout-section">

                        <h2>
                            Seus dados
                        </h2>


                        <div class="form-group">

                            <label for="name">
                                Nome completo
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Seu nome completo"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="email">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="seu@email.com"
                                    autocomplete="email"
                                    required
                                >
