<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produto | Minha Loja</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >
            Minha Loja
        </a>

        <nav class="nav">

            <a href="index.html">
                Produtos
            </a>

            <button
                class="cart-button"
                id="cartButton"
            >
                🛒 Carrinho
                <span id="cartCount">0</span>
            </button>

        </nav>

    </div>

</header>


<main>

    <section class="product-page">

        <div
            class="container"
            id="productContainer"
        ></div>

    </section>

</main>


<div
    id="cartModal"
    class="cart-modal"
>

    <div class="cart-content">

        <div class="cart-header">

            <h2>
                Seu carrinho
            </h2>

            <button
                id="closeCart"
                class="close-button"
            >
                ×
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="cart-footer">

            <strong>
                Total:
                R$
                <span id="cartTotal">
                    0,00
                </span>
            </strong>

            <button
                id="checkoutButton"
                class="button"
            >
                Finalizar pedido
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
